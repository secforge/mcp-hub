server {
    listen 80;
    listen [::]:80;
    server_name mcp-hub.secforge.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp-hub.secforge.de;

    ssl_certificate /etc/letsencrypt/live/mcp-hub.secforge.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-hub.secforge.de/privkey.pem;

    location / {
        proxy_pass http://mcp-hub:8765$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
